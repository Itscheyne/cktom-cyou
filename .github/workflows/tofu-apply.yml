name: tofu-apply

on:
  push:
    branches: [main]

# Serialize all applies — never run two applies concurrently against the same state.
concurrency:
  group: tofu-apply
  cancel-in-progress: false

jobs:
  apply:
    name: tofu apply
    runs-on: ubuntu-latest
    # Environment gate: approval layer before prod apply.
    # Remove 'environment:' line below to auto-apply on merge without gate.
    environment: apply-gate

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: "1.9.1"

      - name: install netbird
        run: curl -fsSL https://pkgs.netbird.io/install.sh | sh

      - name: join netbird mesh
        run: |
          sudo netbird up \
            --setup-key "$NETBIRD_SETUP_KEY" \
            --daemon-addr unix:///var/run/netbird.sock
          for i in $(seq 1 15); do
            STATUS=$(sudo netbird status 2>/dev/null | grep -c "Connected" || true)
            [ "$STATUS" -gt 0 ] && break
            sleep 2
          done
          sudo netbird status
        env:
          NETBIRD_SETUP_KEY: ${{ secrets.NETBIRD_SETUP_KEY }}
          NETBIRD_MANAGEMENT_URL: ${{ secrets.NETBIRD_MANAGEMENT_URL }}

      - name: tofu init
        run: tofu init -input=false

      - name: tofu apply
        run: tofu apply -input=false -auto-approve

      - name: Cleanup tfvars
        if: always()
        run: rm -f ci.auto.tfvars
