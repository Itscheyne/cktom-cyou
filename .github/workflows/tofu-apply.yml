name: tofu-apply

on:
  push:
    branches: [main]

# Serialize all applies so no two applies run concurrently against the same state.
concurrency:
  group: tofu-apply
  cancel-in-progress: false

jobs:
  plan:
    name: tofu plan
    runs-on: ubuntu-latest
    # Read-only: computes the plan that the apply job will execute verbatim.
    # No environment gate here — the gate lives on the apply job below.

    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
      CLOUDFLARE_R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_R2_ACCOUNT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: "1.9.1"

      - name: Install netbird
        run: curl -fsSL https://pkgs.netbird.io/install.sh | sh

      - name: Join netbird mesh
        run: |
          sudo netbird up \
            --setup-key "$NETBIRD_SETUP_KEY" \
            --daemon-addr unix:///var/run/netbird.sock
          for i in $(seq 1 15); do
            STATUS=$(sudo netbird status 2>/dev/null | grep -c "Connected" || true)
            if [ "$STATUS" -gt 0 ]; then break; fi
            sleep 2
          done
          sudo netbird status
        env:
          NETBIRD_SETUP_KEY: ${{ secrets.NETBIRD_SETUP_KEY }}

      - name: Write tfvars
        run: |
          cat > ci.auto.tfvars <<EOF
          proxmox_insecure = true
          node1_endpoint   = "${NODE1_ENDPOINT}"
          node3_endpoint   = "${NODE3_ENDPOINT}"
          node4_endpoint   = "${NODE4_ENDPOINT}"
          EOF
          format_token() {
            local token="$1"
            local token_type="$2"
            if [ -n "$token" ]; then
              if [[ "$token" != *"!"* ]]; then
                token="ghprod@pve!${token_type}=${token}"
              fi
              echo "$token"
            fi
          }
          T1=$(format_token "${NODE1_API_TOKEN}" "plan")
          if [ -n "$T1" ]; then echo "node1_api_token = \"$T1\"" >> ci.auto.tfvars; fi
          T3=$(format_token "${NODE3_API_TOKEN}" "plan")
          if [ -n "$T3" ]; then echo "node3_api_token = \"$T3\"" >> ci.auto.tfvars; fi
          T4=$(format_token "${NODE4_API_TOKEN}" "plan")
          if [ -n "$T4" ]; then echo "node4_api_token = \"$T4\"" >> ci.auto.tfvars; fi
        env:
          NODE1_ENDPOINT: ${{ secrets.NODE1_ENDPOINT }}
          NODE1_API_TOKEN: ${{ secrets.NODE1_GHPROD_PLAN_TOKEN }}
          NODE3_ENDPOINT: ${{ secrets.NODE3_ENDPOINT }}
          NODE3_API_TOKEN: ${{ secrets.NODE3_GHPROD_PLAN_TOKEN }}
          NODE4_ENDPOINT: ${{ secrets.NODE4_ENDPOINT }}
          NODE4_API_TOKEN: ${{ secrets.NODE4_GHPROD_PLAN_TOKEN }}

      - name: tofu init
        run: tofu init -input=false -backend-config="endpoint=https://${CLOUDFLARE_R2_ACCOUNT_ID}.r2.cloudflarestorage.com"

      - name: tofu plan
        run: |
          PLAN_FLAGS="-input=false -out=tfplan.binary"
          NODE1_HOST=$(echo "${NODE1_ENDPOINT}" | sed -e 's|https://||' -e 's|http://||' -e 's|:.*||' -e 's|/.*||')
          if [ -z "$NODE1_HOST" ] || ! getent hosts "$NODE1_HOST" >/dev/null 2>&1; then
            echo "node1 host ($NODE1_HOST) unreachable/offline; excluding module.node1"
            PLAN_FLAGS="$PLAN_FLAGS -exclude=module.node1"
          fi
          NODE3_HOST=$(echo "${NODE3_ENDPOINT}" | sed -e 's|https://||' -e 's|http://||' -e 's|:.*||' -e 's|/.*||')
          if [ -z "$NODE3_HOST" ] || ! getent hosts "$NODE3_HOST" >/dev/null 2>&1; then
            echo "node3 host ($NODE3_HOST) unreachable/offline; excluding module.node3"
            PLAN_FLAGS="$PLAN_FLAGS -exclude=module.node3"
          fi
          NODE4_HOST=$(echo "${NODE4_ENDPOINT}" | sed -e 's|https://||' -e 's|http://||' -e 's|:.*||' -e 's|/.*||')
          if [ -z "$NODE4_HOST" ] || ! getent hosts "$NODE4_HOST" >/dev/null 2>&1; then
            echo "node4 host ($NODE4_HOST) unreachable/offline; excluding module.node4"
            PLAN_FLAGS="$PLAN_FLAGS -exclude=module.node4"
          fi
          tofu plan $PLAN_FLAGS
        env:
          NODE1_ENDPOINT: ${{ secrets.NODE1_ENDPOINT }}
          NODE3_ENDPOINT: ${{ secrets.NODE3_ENDPOINT }}
          NODE4_ENDPOINT: ${{ secrets.NODE4_ENDPOINT }}

      - name: Show plan summary
        run: |
          echo "## Tofu Apply — Plan Preview (${{ github.sha }})" >> $GITHUB_STEP_SUMMARY
          echo '```hcl' >> $GITHUB_STEP_SUMMARY
          tofu show -no-color tfplan.binary >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Upload plan artifact
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-${{ github.sha }}
          path: tfplan.binary
          retention-days: 1

      - name: Cleanup tfvars
        if: always()
        run: rm -f ci.auto.tfvars

  apply:
    name: tofu apply
    needs: plan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    # Human approval gate: this job pauses until a required reviewer on the
    # 'apply-gate' environment approves the deployment. Applies the exact
    # plan binary computed by the `plan` job above — no re-plan, no drift
    # between what was reviewed and what gets executed.
    environment: apply-gate

    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
      CLOUDFLARE_R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_R2_ACCOUNT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: "1.9.1"

      - name: Install netbird
        run: curl -fsSL https://pkgs.netbird.io/install.sh | sh

      - name: Join netbird mesh
        run: |
          sudo netbird up \
            --setup-key "$NETBIRD_SETUP_KEY" \
            --daemon-addr unix:///var/run/netbird.sock
          for i in $(seq 1 15); do
            STATUS=$(sudo netbird status 2>/dev/null | grep -c "Connected" || true)
            if [ "$STATUS" -gt 0 ]; then break; fi
            sleep 2
          done
          sudo netbird status
        env:
          NETBIRD_SETUP_KEY: ${{ secrets.NETBIRD_SETUP_KEY }}

      - name: Write tfvars
        run: |
          cat > ci.auto.tfvars <<EOF
          proxmox_insecure = true
          node1_endpoint   = "${NODE1_ENDPOINT}"
          node3_endpoint   = "${NODE3_ENDPOINT}"
          node4_endpoint   = "${NODE4_ENDPOINT}"
          EOF
          format_token() {
            local token="$1"
            local token_type="$2"
            if [ -n "$token" ]; then
              if [[ "$token" != *"!"* ]]; then
                token="ghprod@pve!${token_type}=${token}"
              fi
              echo "$token"
            fi
          }
          T1=$(format_token "${NODE1_API_TOKEN}" "apply")
          if [ -n "$T1" ]; then echo "node1_api_token = \"$T1\"" >> ci.auto.tfvars; fi
          T3=$(format_token "${NODE3_API_TOKEN}" "apply")
          if [ -n "$T3" ]; then echo "node3_api_token = \"$T3\"" >> ci.auto.tfvars; fi
          T4=$(format_token "${NODE4_API_TOKEN}" "apply")
          if [ -n "$T4" ]; then echo "node4_api_token = \"$T4\"" >> ci.auto.tfvars; fi
        env:
          NODE1_ENDPOINT: ${{ secrets.NODE1_ENDPOINT }}
          NODE1_API_TOKEN: ${{ secrets.NODE1_GHPROD_APPLY_TOKEN }}
          NODE3_ENDPOINT: ${{ secrets.NODE3_ENDPOINT }}
          NODE3_API_TOKEN: ${{ secrets.NODE3_GHPROD_APPLY_TOKEN }}
          NODE4_ENDPOINT: ${{ secrets.NODE4_ENDPOINT }}
          NODE4_API_TOKEN: ${{ secrets.NODE4_GHPROD_APPLY_TOKEN }}

      - name: Download plan artifact
        uses: actions/download-artifact@v4
        with:
          name: tfplan-${{ github.sha }}

      - name: tofu init
        run: tofu init -input=false -backend-config="endpoint=https://${CLOUDFLARE_R2_ACCOUNT_ID}.r2.cloudflarestorage.com"

      - name: tofu apply
        run: |
          set -o pipefail
          tofu apply tfplan.binary 2>&1 | tee apply_output.log

      - name: Report CI Failure to Hermes
        if: failure()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LOG_SUMMARY=$(tail -n 200 apply_output.log 2>/dev/null || echo "Log not found")

          JSON_PAYLOAD=$(jq -n \
            --arg event "ci_failure" \
            --arg workflow "${{ github.workflow }}" \
            --arg run_id "${{ github.run_id }}" \
            --arg repository "${{ github.repository }}" \
            --arg branch "${{ github.ref_name }}" \
            --arg commit_sha "${{ github.sha }}" \
            --arg actor "${{ github.actor }}" \
            --arg error_step "tofu apply" \
            --arg logs_summary "$LOG_SUMMARY" \
            --arg run_url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            '{
              event: $event,
              workflow: $workflow,
              run_id: $run_id,
              repository: $repository,
              branch: $branch,
              commit_sha: $commit_sha,
              actor: $actor,
              error_step: $error_step,
              logs_summary: $logs_summary,
              run_url: $run_url
            }')

          ISSUE_BODY=$(cat <<ISSUE_EOF
          CI \`tofu apply\` failed. Please investigate and fix the infrastructure code.

          ### Automated Context
          <!-- HERMES_PAYLOAD_START -->
          \`\`\`json
          $JSON_PAYLOAD
          \`\`\`
          <!-- HERMES_PAYLOAD_END -->

          ### Human-Readable Summary
          - **Workflow:** ${{ github.workflow }}
          - **Branch:** ${{ github.ref_name }}
          - **Commit:** ${{ github.sha }}
          - **Run URL:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          ### Last 200 Lines of Logs
          \`\`\`
          $LOG_SUMMARY
          \`\`\`
          ISSUE_EOF
          )

          gh issue create \
            --title "[CI Failure] tofu-apply failed on branch: ${{ github.ref_name }}" \
            --body "$ISSUE_BODY" \
            --label "ci-failure,agent-action-required" || echo "Failed to create issue"

      - name: Post apply result
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            BODY="✅ tofu apply succeeded for ${{ github.sha }} (approved via apply-gate)."
          else
            BODY="❌ tofu apply FAILED for ${{ github.sha }}. Check the workflow run for details."
          fi
          gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" \
            -f body="$BODY" || echo "Failed to post commit comment"

      - name: Cleanup tfvars
        if: always()
        run: rm -f ci.auto.tfvars
