name: build-tofu-ci-image

on:
  push:
    branches: [main]
    paths:
      - "docker/tofu-ci/Dockerfile"
  pull_request:
    branches: [main]
    paths:
      - "docker/tofu-ci/Dockerfile"
  workflow_dispatch: {}

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}/tofu-ci

# Only one build/publish at a time; a queued push wins over an in-flight one.
concurrency:
  group: build-tofu-ci-image
  cancel-in-progress: true

jobs:
  build:
    name: build and publish tofu-ci image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        # PRs from forks don't get package write access; build-only (no push) there.
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: docker/tofu-ci
          file: docker/tofu-ci/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
