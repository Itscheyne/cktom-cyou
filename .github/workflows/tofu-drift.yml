name: tofu-drift

on:
  # Daily drift check at 06:00 UTC
  schedule:
    - cron: "0 6 * * *"
  # Manual trigger for on-demand drift checks
  workflow_dispatch:
    inputs:
      scope:
        description: "Scope: node34 (default) or all"
        required: false
        default: "node34"

permissions:
  contents: read
  packages: read

# Only one drift check at a time. cancel-in-progress=false so a run waiting
# for plan-gate approval isn't silently killed by the next scheduled run.
concurrency:
  group: tofu-drift
  cancel-in-progress: false

jobs:
  drift:
    name: drift detection (node3 + node4)
    runs-on: ubuntu-latest
    # Same plan-gate environment as tofu-plan — requires manual approval for secrets
    environment: plan-gate

    container:
      image: ghcr.io/itscheyne/cktom-cyou/tofu-ci:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --cap-add=NET_ADMIN --device=/dev/net/tun

    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
      CLOUDFLARE_R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_R2_ACCOUNT_ID }}

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Join netbird mesh
        run: |
          sudo netbird service start || true
          sudo netbird up \
            --setup-key "$NETBIRD_SETUP_KEY" \
            --daemon-addr unix:///var/run/netbird.sock
          for i in $(seq 1 15); do
            STATUS=$(sudo netbird status 2>/dev/null | grep -c "Connected" || true)
            if [ "$STATUS" -gt 0 ]; then break; fi
            sleep 2
          done
          sudo netbird status
          sleep 5 # wait for routes
        env:
          NETBIRD_SETUP_KEY: ${{ secrets.NETBIRD_SETUP_KEY }}

      - name: Write tfvars
        run: |
          cat > ci.auto.tfvars <<EOF
          proxmox_insecure     = true
          node1_endpoint       = "${NODE1_ENDPOINT}"
          node3_endpoint       = "${NODE3_ENDPOINT}"
          node4_endpoint       = "${NODE4_ENDPOINT}"
          EOF
          format_token() {
            local token="$1"
            local token_type="$2"
            if [ -n "$token" ]; then
              if [[ "$token" != *"!"* ]]; then
                token="ghprod@pve!${token_type}=${token}"
              fi
              echo "$token"
            fi
          }
          T1=$(format_token "${NODE1_API_TOKEN}" "plan")
          if [ -n "$T1" ]; then echo "node1_api_token = \"$T1\"" >> ci.auto.tfvars; fi
          T3=$(format_token "${NODE3_API_TOKEN}" "plan")
          if [ -n "$T3" ]; then echo "node3_api_token = \"$T3\"" >> ci.auto.tfvars; fi
          T4=$(format_token "${NODE4_API_TOKEN}" "plan")
          if [ -n "$T4" ]; then echo "node4_api_token = \"$T4\"" >> ci.auto.tfvars; fi
        env:
          NODE1_ENDPOINT: ${{ secrets.NODE1_ENDPOINT }}
          NODE1_API_TOKEN: ${{ secrets.NODE1_GHPROD_PLAN_TOKEN }}
          NODE3_ENDPOINT: ${{ secrets.NODE3_ENDPOINT }}
          NODE3_API_TOKEN: ${{ secrets.NODE3_GHPROD_PLAN_TOKEN }}
          NODE4_ENDPOINT: ${{ secrets.NODE4_ENDPOINT }}
          NODE4_API_TOKEN: ${{ secrets.NODE4_GHPROD_PLAN_TOKEN }}

      - name: tofu init
        run: tofu init -input=false -backend-config="endpoint=https://${CLOUDFLARE_R2_ACCOUNT_ID}.r2.cloudflarestorage.com"

      - name: tofu validate
        run: tofu validate

      - name: Drift detection (node3 + node4)
        shell: bash
        run: |
          TOFU_PLAN_FLAGS=""
          # prod3 quadlet provisioning needs an ssh-agent (SSH_AUTH_SOCK) that CI
          # runners don't have; always exclude here (talos cluster takeover will
          # remove prod3 entirely, see PR discussion). Real fix tracked separately.
          TOFU_PLAN_FLAGS="$TOFU_PLAN_FLAGS -exclude=null_resource.prod3_quadlets -exclude=null_resource.openviking_config"
          # Exclude node3 if unreachable (Netbird may not route to it yet)
          NODE3_HOST=$(echo "${NODE3_ENDPOINT}" | sed -e 's|https://||' -e 's|http://||' -e 's|:.*||' -e 's|/.*||')
          if [ -n "$NODE3_HOST" ] && ! nc -z -w 3 "$NODE3_HOST" 8006 >/dev/null 2>&1; then
            echo "::warning::node3 unreachable on port 8006 — excluding module.node3 from drift check"
            TOFU_PLAN_FLAGS="$TOFU_PLAN_FLAGS -exclude=module.node3"
          fi
          NODE4_HOST=$(echo "${NODE4_ENDPOINT}" | sed -e 's|https://||' -e 's|http://||' -e 's|:.*||' -e 's|/.*||')
          if [ -n "$NODE4_HOST" ] && ! nc -z -w 3 "$NODE4_HOST" 8006 >/dev/null 2>&1; then
            echo "::warning::node4 unreachable on port 8006 — excluding module.node4 from drift check"
            TOFU_PLAN_FLAGS="$TOFU_PLAN_FLAGS -exclude=module.node4"
          fi
          export TOFU_PLAN_FLAGS
          bash scripts/test-drift.sh
        env:
          NODE3_ENDPOINT: ${{ secrets.NODE3_ENDPOINT }}
          NODE4_ENDPOINT: ${{ secrets.NODE4_ENDPOINT }}

      - name: State validation
        run: |
          # tofu show does not support -exclude (plan-only flag); validate
          # against the plan file produced by test-drift.sh instead.
          tofu show -json tfplan.binary \
            2>/dev/null | python3 scripts/test-state.py

      - name: Cleanup
        if: always()
        run: rm -f ci.auto.tfvars tfplan.binary
