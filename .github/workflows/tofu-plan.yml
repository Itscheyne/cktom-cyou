name: tofu-plan

on:
  pull_request:
    branches: [main]
    paths:
      - "**.tf"
      - "**.tfvars"
      - ".github/workflows/tofu-plan.yml"
      - ".github/workflows/tofu-apply.yml"

concurrency:
  group: tofu-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    name: plan
    runs-on: ubuntu-latest
    environment: prod

    steps:
      - uses: actions/checkout@v4

      - name: install tofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: "1.13.2"

      - name: install netbird
        run: curl -fsSL https://pkgs.netbird.io/install.sh | sh

      - name: join netbird mesh
        run: |
          sudo netbird up --setup-key "$NETBIRD_SETUP_KEY" --daemon-addr unix:///var/run/netbird.sock
          for i in $(seq 1 15); do
            STATUS=$(sudo netbird status 2>/dev/null | grep -c "Connected" || true)
            [ "$STATUS" -gt 0 ] && break
            sleep 2
          done
          sudo netbird status
        env:
          NETBIRD_SETUP_KEY: ${{ secrets.NETBIRD_SETUP_KEY }}

      - name: tofu init
        run: tofu init -input=false
        env:
          TF_VAR_node1_endpoint: ${{ secrets.TF_VAR_NODE1_ENDPOINT }}
          TF_VAR_node1_username: ${{ secrets.TF_VAR_NODE1_USERNAME }}
          TF_VAR_node1_password: ${{ secrets.TF_VAR_NODE1_PASSWORD }}
          TF_VAR_node3_endpoint: ${{ secrets.TF_VAR_NODE3_ENDPOINT }}
          TF_VAR_node3_username: ${{ secrets.TF_VAR_NODE3_USERNAME }}
          TF_VAR_node3_password: ${{ secrets.TF_VAR_NODE3_PASSWORD }}
          TF_VAR_node4_endpoint: ${{ secrets.TF_VAR_NODE4_ENDPOINT }}
          TF_VAR_node4_username: ${{ secrets.TF_VAR_NODE4_USERNAME }}
          TF_VAR_node4_password: ${{ secrets.TF_VAR_NODE4_PASSWORD }}
          TF_VAR_talos_netbird_setup_key: ${{ secrets.TF_VAR_TALOS_NETBIRD_SETUP_KEY }}

      - name: tofu plan
        id: plan
        run: tofu plan -input=false -no-color -out=tfplan 2>&1 | tee plan.txt
        env:
          TF_VAR_node1_endpoint: ${{ secrets.TF_VAR_NODE1_ENDPOINT }}
          TF_VAR_node1_username: ${{ secrets.TF_VAR_NODE1_USERNAME }}
          TF_VAR_node1_password: ${{ secrets.TF_VAR_NODE1_PASSWORD }}
          TF_VAR_node3_endpoint: ${{ secrets.TF_VAR_NODE3_ENDPOINT }}
          TF_VAR_node3_username: ${{ secrets.TF_VAR_NODE3_USERNAME }}
          TF_VAR_node3_password: ${{ secrets.TF_VAR_NODE3_PASSWORD }}
          TF_VAR_node4_endpoint: ${{ secrets.TF_VAR_NODE4_ENDPOINT }}
          TF_VAR_node4_username: ${{ secrets.TF_VAR_NODE4_USERNAME }}
          TF_VAR_node4_password: ${{ secrets.TF_VAR_NODE4_PASSWORD }}
          TF_VAR_talos_netbird_setup_key: ${{ secrets.TF_VAR_TALOS_NETBIRD_SETUP_KEY }}

      - name: post plan to PR
        if: always()
        uses: actions/github-script@v7
        env:
          PLAN_OUTCOME: ${{ steps.plan.outcome }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('plan.txt', 'utf8');
            const MAX = 65000;
            const truncated = plan.length > MAX
              ? plan.slice(0, MAX) + '\n\n[truncated — see full log in Actions]'
              : plan;
            const status = process.env.PLAN_OUTCOME === 'success' ? '✅' : '❌';
            const runUrl = process.env.RUN_URL;
            const runId = process.env.RUN_ID;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## ${status} tofu plan\n\n<details><summary>Show plan</summary>\n\n\`\`\`\n${truncated}\n\`\`\`\n</details>\n\n*Run: [#${runId}](${runUrl})*`
            });

      - name: leave netbird mesh
        if: always()
        run: sudo netbird down
