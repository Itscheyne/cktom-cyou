name: tofu-plan

on:
  pull_request:
    branches: [main]

# Prevent concurrent plan runs on same PR
concurrency:
  group: tofu-plan-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  plan:
    name: tofu validate + plan
    runs-on: ubuntu-latest
    # Environment gate: requires manual approval before secrets are injected.
    # Prevents fork PRs from accessing prod credentials without human sign-off.
    environment: plan-gate

    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          # Pin to head sha, not merge commit. Combined with environment gate,
          # secrets only flow after human approval and workflow changes in the
          # PR don't take effect until merged.
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: "1.9.1"

      - name: Install netbird
        run: curl -fsSL https://pkgs.netbird.io/install.sh | sh

      - name: Join netbird mesh
        run: |
          sudo netbird up \
            --setup-key "$NETBIRD_SETUP_KEY" \
            --daemon-addr unix:///var/run/netbird.sock
          for i in $(seq 1 15); do
            STATUS=$(sudo netbird status 2>/dev/null | grep -c "Connected" || true)
            [ "$STATUS" -gt 0 ] && break
            sleep 2
          done
          sudo netbird status
        env:
          NETBIRD_SETUP_KEY: ${{ secrets.NETBIRD_SETUP_KEY }}

      - name: Write tfvars
        run: |
          cat > ci.auto.tfvars <<EOF
          proxmox_insecure = true
          node1_endpoint   = "${NODE1_ENDPOINT}"
          node1_username   = "ci@pve"
          node1_api_token  = "${NODE1_API_TOKEN}"
          node3_endpoint   = "${NODE3_ENDPOINT}"
          node3_username   = "ci@pve"
          node3_api_token  = "${NODE3_API_TOKEN}"
          node4_endpoint   = "${NODE4_ENDPOINT}"
          node4_username   = "ci@pve"
          node4_api_token  = "${NODE4_API_TOKEN}"
          EOF
        env:
          NODE1_ENDPOINT:  ${{ secrets.NODE1_ENDPOINT }}
          NODE1_API_TOKEN: ${{ secrets.NODE1_GHPROD_PLAN_TOKEN }}
          NODE3_ENDPOINT:  ${{ secrets.NODE3_ENDPOINT }}
          NODE3_API_TOKEN: ${{ secrets.NODE3_GHPROD_PLAN_TOKEN }}
          NODE4_ENDPOINT:  ${{ secrets.NODE4_ENDPOINT }}
          NODE4_API_TOKEN: ${{ secrets.NODE4_GHPROD_PLAN_TOKEN }}

      - name: tofu init
        run: tofu init -input=false

      - name: tofu validate
        run: tofu validate

      - name: tofu plan
        run: tofu plan -input=false -out=tfplan.binary

      - name: Show plan summary
        run: tofu show -no-color tfplan.binary

      - name: Cleanup tfvars
        if: always()
        run: rm -f ci.auto.tfvars tfplan.binary
