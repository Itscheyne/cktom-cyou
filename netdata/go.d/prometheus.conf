# Netdata go.d prometheus collector
#
# Deploy to: /etc/netdata/go.d/prometheus.conf on the Netdata host (prod3)
# (netdata.container mounts /etc/netdata:/etc/netdata:Z, so this file lives at
#  /etc/netdata/go.d/prometheus.conf on the prod3 host)
#
# Jobs in this file:
#   1. omniroute          — OmniRoute gateway metrics (loopback:9877)
#   2. opnsense_suricata  — OPNSense IPS Suricata metrics via opnsense-exporter (loopback:9100)
#   3. securityonion_suricata — Security Onion IDS Suricata metrics via suricata_exporter (so-oc:9917)
#
# ────────────────────────────────────────────────────────────────────────────
# Job 1: OmniRoute
# Prerequisites:
#   - omniroute-exporter container running (quadlet/omniroute-exporter.container)
#   - Exporter binds to 127.0.0.1:9877 (loopback only)
#
# Metrics collected (all prefixed omniroute_):
#   up, setup_complete, uptime_seconds, heap_*_bytes
#   admitted/rejected/would_reject_requests_total
#   admission_utilization, circuit_breaker_open
#   requests_total, errors_total, tokens_input/output_total
#   request_latency_avg/p95/p99_ms
#   semantic_cache_hits/misses/hit_rate/tokens_saved
#   prompt_cache_requests/tokens_saved/cost_saved_usd
#   combo_requests_total, combo_latency_avg_ms
#   exporter_last_scrape_unix
#
# Reference: netdata/omniroute-exporter/README.md
# ────────────────────────────────────────────────────────────────────────────
# Job 2: OPNSense Suricata IPS
# Prerequisites:
#   1. opnsense-exporter container running (quadlet/opnsense-exporter.container)
#   2. OPNSense API key+secret stored as podman secrets:
#      printf '%s' 'KEY'    | podman secret create OPNSENSE_API_KEY -
#      printf '%s' 'SECRET' | podman secret create OPNSENSE_API_SECRET -
#   3. OPNSense API user needs read access to IDS/Intrusion Detection
#
# Metrics collected (prefixed opnsense_):
#   ids_alert_total, ids_drop_total
#   firewall_bytes_in/out, firewall_packets_in/out
#   gateway_status, interface_status, service_status
#   (full list: https://github.com/AthennaMind/opnsense-exporter#metrics-list)
# ────────────────────────────────────────────────────────────────────────────
# Job 3: Security Onion Suricata IDS
# Prerequisites:
#   1. corelight/suricata_exporter binary installed on so-oc VM (node3/VM 501)
#   2. Suricata unix socket enabled on so-oc (see netdata/SURICATA_SETUP.md)
#   3. suricata-exporter.service running on so-oc, bound to 0.0.0.0:9917
#   4. so-oc's VLAN-3 IP reachable from prod3 — update SO_OC_VLAN3_IP below
#
# Metrics collected (prefixed suricata_):
#   suricata_detect_alerts_total
#   suricata_decoder_packets_total, suricata_decoder_bytes_total
#   suricata_flow_*, suricata_tcp_*, suricata_capture_kernel_drops_total
#   (full list: https://github.com/corelight/suricata_exporter)
# ────────────────────────────────────────────────────────────────────────────

jobs:

  # ── OmniRoute gateway metrics ─────────────────────────────────────────────
  - name: omniroute
    url: "http://127.0.0.1:9877/metrics"
    update_every: 30
    timeout: 10
    not_follow_redirects: yes
    # All metrics are already namespaced omniroute_* — no filtering needed.

  # ── OPNSense Suricata IPS ─────────────────────────────────────────────────
  # opnsense-exporter runs as a container on prod3 (quadlet/opnsense-exporter.container)
  # and exposes metrics on loopback port 9100.
  - name: opnsense_suricata
    url: "http://127.0.0.1:9100/metrics"
    update_every: 30
    timeout: 15
    not_follow_redirects: yes
    selector:
      allow:
        - pattern: "opnsense_ids_*"
        - pattern: "opnsense_firewall_*"
        - pattern: "opnsense_gateway_*"
        - pattern: "opnsense_service_*"
        - pattern: "opnsense_up"

  # ── Security Onion Suricata IDS ───────────────────────────────────────────
  # suricata_exporter runs on the so-oc VM (node3/VM 501) and is scraped remotely.
  # Update the IP below to so-oc's VLAN-3 address once known.
  # See netdata/SURICATA_SETUP.md for installation steps on so-oc.
  - name: securityonion_suricata
    url: "http://REPLACE_WITH_SO_OC_VLAN3_IP:9917/metrics"
    update_every: 30
    timeout: 15
    not_follow_redirects: yes
    selector:
      allow:
        - pattern: "suricata_detect_alerts_total"
        - pattern: "suricata_decoder_*"
        - pattern: "suricata_flow_*"
        - pattern: "suricata_capture_kernel_drops_total"
        - pattern: "suricata_tcp_*"
        - pattern: "suricata_up"
