# Netdata go.d httpcheck — OmniRoute prod monitoring
#
# Deploy to: /etc/netdata/go.d/httpcheck.conf on the Netdata host
# (node3 / prod3.sf.cktom.cyou — netdata.container mounts /etc/netdata:/etc/netdata:Z,
# so this file can be dropped directly on the host at that path).
#
# See netdata/go.d/README.md in this repo for:
#   - secret provisioning steps (bearer token file)
#   - the apiKeyId placeholder for the budget job
#   - known limitation: httpcheck is a liveness/latency prober, not a JSON
#     field-value scraper — see README "Scope & limitations".
#
# Schema ref: https://github.com/netdata/netdata/tree/master/src/go/plugin/go.d/collector/httpcheck
#
# Every job below only ever emits Netdata's 4 fixed httpcheck charts
# (response_time, response_length, status, in_state) — no OmniRoute
# response body content, header, or field value is ever charted, logged,
# or stored. response_match only tests for presence of a known JSON key
# name (no capture groups) and is deliberately omitted on the four raw
# log endpoints, which are checked for HTTP status only.

jobs:
  # ---- Public endpoint (no auth) --------------------------------------
  - name: omniroute_health
    url: https://omniroute.prod.sf.cktom.cyou/api/monitoring/health
    method: GET
    update_every: 20
    timeout: 5
    status_accepted: [200]
    not_follow_redirects: yes
    tls_skip_verify: no
    headers:
      Accept: application/json
    response_match: "\"status\""

  # ---- Aggregate / low-cost endpoints (mgmt auth) ---------------------
  - name: omniroute_telemetry_summary
    url: https://omniroute.prod.sf.cktom.cyou/api/telemetry/summary
    method: GET
    update_every: 60
    timeout: 5
    status_accepted: [200]
    not_follow_redirects: yes
    tls_skip_verify: no
    bearer_token_file: /etc/netdata/secrets/omniroute_token
    headers:
      Accept: application/json
    response_match: "\"totalRequests\""

  - name: omniroute_cache_stats
    url: https://omniroute.prod.sf.cktom.cyou/api/cache/stats
    method: GET
    update_every: 60
    timeout: 5
    status_accepted: [200]
    not_follow_redirects: yes
    tls_skip_verify: no
    bearer_token_file: /etc/netdata/secrets/omniroute_token
    headers:
      Accept: application/json
    response_match: "\"hitRate\""

  # NOTE: apiKeyId is a mandatory query param on this endpoint (not a
  # secret — it identifies which API key's budget to check). Replace
  # REPLACE_WITH_API_KEY_ID below with the key you want monitored, or
  # comment this job out if no single key is representative.
  - name: omniroute_usage_budget
    url: https://omniroute.prod.sf.cktom.cyou/api/usage/budget?apiKeyId=REPLACE_WITH_API_KEY_ID
    method: GET
    update_every: 60
    timeout: 5
    status_accepted: [200]
    not_follow_redirects: yes
    tls_skip_verify: no
    bearer_token_file: /etc/netdata/secrets/omniroute_token
    headers:
      Accept: application/json
    response_match: "\"budget\""

  # ---- Heavier aggregate endpoints (DB/percentile queries, mgmt auth) --
  - name: omniroute_usage_analytics
    url: https://omniroute.prod.sf.cktom.cyou/api/usage/analytics?period=day
    method: GET
    update_every: 300
    timeout: 8
    status_accepted: [200]
    not_follow_redirects: yes
    tls_skip_verify: no
    bearer_token_file: /etc/netdata/secrets/omniroute_token
    headers:
      Accept: application/json
    response_match: "\"errorBreakdown\""

  - name: omniroute_usage_history
    url: https://omniroute.prod.sf.cktom.cyou/api/usage/history
    method: GET
    update_every: 300
    timeout: 8
    status_accepted: [200]
    not_follow_redirects: yes
    tls_skip_verify: no
    bearer_token_file: /etc/netdata/secrets/omniroute_token
    headers:
      Accept: application/json
    response_match: "\"totalCost\""

  - name: omniroute_usage_cache_health
    url: https://omniroute.prod.sf.cktom.cyou/api/usage/cache-health?range=1h
    method: GET
    update_every: 300
    timeout: 8
    status_accepted: [200]
    not_follow_redirects: yes
    tls_skip_verify: no
    bearer_token_file: /etc/netdata/secrets/omniroute_token
    headers:
      Accept: application/json
    response_match: "\"verdict\""

  - name: omniroute_usage_model_latency
    url: https://omniroute.prod.sf.cktom.cyou/api/usage/model-latency-stats?windowHours=1&maxRows=100
    method: GET
    update_every: 300
    timeout: 8
    status_accepted: [200]
    not_follow_redirects: yes
    tls_skip_verify: no
    bearer_token_file: /etc/netdata/secrets/omniroute_token
    headers:
      Accept: application/json
    response_match: "\"stats\""

  # ---- Raw log / event endpoints (mgmt auth) ---------------------------
  # Connectivity check ONLY — no response_match against these bodies.
  # They can contain prompts, tokens, and user/session identifiers, and
  # httpcheck has no field-extraction capability, so there is nothing to
  # gain from inspecting the body and every reason not to.
  - name: omniroute_usage_call_logs
    url: https://omniroute.prod.sf.cktom.cyou/api/usage/call-logs?limit=1&offset=0
    method: GET
    update_every: 300
    timeout: 8
    status_accepted: [200]
    not_follow_redirects: yes
    tls_skip_verify: no
    bearer_token_file: /etc/netdata/secrets/omniroute_token
    headers:
      Accept: application/json

  - name: omniroute_usage_logs
    url: https://omniroute.prod.sf.cktom.cyou/api/usage/logs?limit=1
    method: GET
    update_every: 300
    timeout: 8
    status_accepted: [200]
    not_follow_redirects: yes
    tls_skip_verify: no
    bearer_token_file: /etc/netdata/secrets/omniroute_token
    headers:
      Accept: application/json

  - name: omniroute_usage_proxy_logs
    url: https://omniroute.prod.sf.cktom.cyou/api/usage/proxy-logs?limit=1
    method: GET
    update_every: 300
    timeout: 8
    status_accepted: [200]
    not_follow_redirects: yes
    tls_skip_verify: no
    bearer_token_file: /etc/netdata/secrets/omniroute_token
    headers:
      Accept: application/json

  - name: omniroute_usage_request_logs
    url: https://omniroute.prod.sf.cktom.cyou/api/usage/request-logs?limit=1
    method: GET
    update_every: 300
    timeout: 8
    status_accepted: [200]
    not_follow_redirects: yes
    tls_skip_verify: no
    bearer_token_file: /etc/netdata/secrets/omniroute_token
    headers:
      Accept: application/json
